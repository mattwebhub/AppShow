name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, lint, test
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache SPM checkouts
        uses: actions/cache@v4
        with:
          path: |
            .build/SourcePackages/artifacts
            .build/SourcePackages/checkouts
            .build/SourcePackages/repositories
          key: xcode-spm-v2-${{ runner.os }}-${{ hashFiles('AppShow.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: xcode-spm-v2-${{ runner.os }}-

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies -project AppShow.xcodeproj -scheme AppShow -derivedDataPath .build

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      - name: Test
        run: make test
