<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description | escape }}">
    <title>{{ site.title | escape }}</title>
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" href="{{ '/assets/app-icon.png' | relative_url }}" type="image/png">
    <link rel="stylesheet" href="{{ '/assets/policy.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#policy">Skip to privacy policy</a>
    <header>
      <a class="brand" href="https://github.com/mattwebhub/AppShow">
        <img src="{{ '/assets/app-icon.png' | relative_url }}" alt="" width="44" height="44">
        <span>AppShow</span>
      </a>
      <a href="https://github.com/mattwebhub/AppShow/issues">Support</a>
    </header>
    <main id="policy">{{ content }}</main>
    <footer>
      <a href="https://github.com/mattwebhub/AppShow/blob/main/PRIVACY.md">View policy source and history</a>
    </footer>
  </body>
</html>
